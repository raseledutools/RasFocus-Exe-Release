name: Build RasFocus (MSVC)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler Environment
      # এই অ্যাকশনটি মাইক্রোসফটের নেটিভ C++ কম্পাইলার (cl.exe) সেটআপ করবে
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install WebView2 SDK via NuGet
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.2420.47 -OutputDirectory packages

    - name: Compile Resources
      # MSVC তে resources.rc কম্পাইল করতে rc.exe ব্যবহার করা হয় (এটি windres এর বিকল্প)
      run: rc.exe resources.rc

    - name: Compile RasFocus.exe
      # cl.exe হলো মাইক্রোসফটের কম্পাইলার। 
      # /MT ফ্ল্যাগটি -static-libstdc++ এর কাজ করে (সবকিছু ভেতরে ঢুকিয়ে নেয়)
      run: |
        cl.exe /EHsc /MT /W3 main.cpp prewindow.cpp tab_dashboard.cpp tab_blocks.cpp tab_schedule_blocks.cpp tab_adult.cpp tab_deep_study.cpp tab_special.cpp tab_statistics.cpp tab_settings.cpp tab_utilities.cpp tab_ai.cpp tab_strict.cpp tab_diary.cpp resources.res /I"./packages/Microsoft.Web.WebView2.1.0.2420.47/build/native/include" /link /SUBSYSTEM:WINDOWS /OUT:RasFocus.exe user32.lib gdi32.lib gdiplus.lib comctl32.lib ole32.lib oleaut32.lib uiautomationcore.lib uuid.lib psapi.lib shlwapi.lib winmm.lib shell32.lib urlmon.lib wininet.lib comdlg32.lib advapi32.lib "./packages/Microsoft.Web.WebView2.1.0.2420.47/build/native/x64/WebView2LoaderStatic.lib"

    - name: Upload Artifact (Single Downloadable EXE)
      uses: actions/upload-artifact@v4
      with:
        name: RasFocus-App-Single
        path: RasFocus.exe
