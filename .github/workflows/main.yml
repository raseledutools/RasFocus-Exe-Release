name: Build RasFocus (MSVC)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler Environment
      # এই অ্যাকশনটি মাইক্রোসফটের নেটিভ C++ কম্পাইলার (cl.exe) সেটআপ করবে
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install WebView2 SDK via NuGet
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.2420.47 -OutputDirectory packages

    # 🟢 NEW STEP: Firebase C++ SDK অটোমেটিক ডাউনলোড এবং সেটআপ
    - name: Download and Setup Firebase C++ SDK
      run: |
        curl -L https://dl.google.com/firebase/sdk/cpp/firebase_cpp_sdk_12.4.0.zip -o firebase.zip
        powershell Expand-Archive -Path firebase.zip -DestinationPath . -Force
        del firebase.zip

    - name: Compile Resources
      # MSVC তে resources.rc কম্পাইল করতে rc.exe ব্যবহার করা হয়
      run: rc.exe resources.rc

    - name: Compile RasFocus.exe (Super Fast Optimized & Auto Lib Finder)
      # 🟢 UPDATED: নিজে নিজে Firebase Library ফাইলটি খুঁজে বের করবে এবং 'Debug' ফোল্ডার ১০০% এড়িয়ে চলবে
      shell: pwsh
      run: |
        # -notmatch "Debug" যুক্ত করা হয়েছে যাতে শুধু মেইন/রিলিজ ফাইলটাই সিলেক্ট হয়
        $libPath = (Get-ChildItem -Path .\firebase_cpp_sdk\libs -Filter firebase_app.lib -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "MT" -and $_.FullName -notmatch "Debug" }).FullName | Select-Object -First 1
        
        # যদি MT ফোল্ডার না থাকে, তবে শুধু x64 এর ফাইলটি নেবে (Debug বাদ দিয়ে)
        if (!$libPath) {
            $libPath = (Get-ChildItem -Path .\firebase_cpp_sdk\libs -Filter firebase_app.lib -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "Debug" }).FullName | Select-Object -First 1
        }
        
        Write-Host "🎯 BINGO! Found Release Firebase Lib exactly at -> $libPath"

        cl.exe /EHsc /MT /O2 /GL /utf-8 /W3 main.cpp prewindow.cpp tab_dashboard.cpp tab_pdf_workspace.cpp mini_browser.cpp tab_blocks.cpp tab_schedule_blocks.cpp tab_adult.cpp tab_deep_study.cpp tab_special.cpp tab_statistics.cpp tab_settings.cpp tab_utilities.cpp tab_ai.cpp tab_strict.cpp tab_diary.cpp accounts.cpp resources.res /I"./packages/Microsoft.Web.WebView2.1.0.2420.47/build/native/include" /I"./firebase_cpp_sdk/include" /link /LTCG /OPT:REF /OPT:ICF /SUBSYSTEM:WINDOWS /OUT:RasFocus.exe user32.lib gdi32.lib gdiplus.lib comctl32.lib ole32.lib oleaut32.lib uiautomationcore.lib uuid.lib psapi.lib shlwapi.lib winmm.lib shell32.lib urlmon.lib wininet.lib comdlg32.lib advapi32.lib crypt32.lib ws2_32.lib rpcrt4.lib secur32.lib bcrypt.lib "./packages/Microsoft.Web.WebView2.1.0.2420.47/build/native/x64/WebView2LoaderStatic.lib" "$libPath"

    - name: Sign RasFocus.exe
      # msvc-dev-cmd আগেই signtool কে PATH-এ যুক্ত করে রেখেছে, তাই সরাসরি কল করলেই হবে
      run: |
        signtool sign /f "RasAppsCert.pfx" /p "1234" /t http://timestamp.digicert.com /fd SHA256 "RasFocus.exe"

    - name: Upload Artifact (Single Downloadable EXE)
      uses: actions/upload-artifact@v4
      with:
        name: RasFocus-App-Signed
        path: RasFocus.exe
